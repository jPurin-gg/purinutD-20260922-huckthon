<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>昼めし（モック）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#1B2A38; --sub:#5F6E7C; --line:#D5DDE4;
  --open:#1F8A5B; --soon:#C27A0E; --closed:#8C97A2; --accent:#24527A; --chip:#E2E8EE;
  --board:#F7F9FB; --dot:#C9D3DC; --memo:#FFE9A3; --memoInk:#3B3112;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A22; --surface:#1B2530; --ink:#E6ECF1; --sub:#9AA8B5; --line:#2C3946;
    --open:#4CC08A; --soon:#E6A541; --closed:#6D7A86; --accent:#8EB8DD; --chip:#26323E;
    --board:#161F28; --dot:#2E3B48; --memo:#5C4E1E; --memoInk:#F5E9C4;
  }
}
:root[data-theme="dark"]{
  --bg:#121A22; --surface:#1B2530; --ink:#E6ECF1; --sub:#9AA8B5; --line:#2C3946;
  --open:#4CC08A; --soon:#E6A541; --closed:#6D7A86; --accent:#8EB8DD; --chip:#26323E;
  --board:#161F28; --dot:#2E3B48; --memo:#5C4E1E; --memoInk:#F5E9C4;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}

/* 上部バー */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
h1{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:22px;margin:0 0 8px}
.tabs{display:flex;align-self:stretch}
.tab{background:none;border:none;padding:8px 14px;font-size:14px;font-weight:700;color:var(--sub);cursor:pointer;
  border-bottom:3px solid transparent;display:flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:11px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.badge:empty{display:none}
.badge.bump{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.45)}100%{transform:scale(1)}}

/* 横スワイプの本体 */
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  overscroll-behavior-x:contain;scrollbar-width:none}
.pager::-webkit-scrollbar{display:none}
.panel{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;position:relative}

/* 一覧 */
.controls{padding:10px 16px 6px;background:var(--bg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub)}
.row + .row{margin-top:8px}
.row b{color:var(--open);font-size:16px}
.row input[type=time],select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.linkbtn{background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;padding:4px}
.filters{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin-top:10px}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--sub);min-width:0}
.filters select{width:100%;padding:7px 8px}
tbody tr{cursor:pointer}
tbody tr:active td{background:var(--chip)}

/* 詳細シート */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;visibility:hidden}
.sheet.open{visibility:visible}
.scrim{position:absolute;inset:0;background:rgba(10,18,26,.45);opacity:0;transition:opacity .2s}
.sheet.open .scrim{opacity:1}
.sbody{position:relative;width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--surface);
  border-radius:16px 16px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .25s ease}
.sheet.open .sbody{transform:translateY(0)}
.gallery{position:relative;border-radius:16px 16px 0 0;overflow:hidden}
.gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gtrack::-webkit-scrollbar{display:none}
.photo{position:relative;flex:0 0 100%;scroll-snap-align:start;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--cat) var(--mix,22%),var(--surface));font-size:84px;line-height:1}
.photo small{position:absolute;left:12px;bottom:12px;font-size:11px;color:var(--sub);background:var(--surface);padding:2px 8px;border-radius:999px}
.gcount{position:absolute;top:12px;left:12px;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:2px 9px;border-radius:999px}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(0,0,0,.35);color:#fff;font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gnav[disabled]{opacity:0;pointer-events:none}
.gprev{left:10px} .gnext{right:10px}
.gdots{position:absolute;bottom:14px;right:12px;display:flex;gap:5px}
.gdots i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.2)}
.gdots i.on{background:rgba(0,0,0,.65);width:16px;border-radius:3px}
.sticky:not(.memo){cursor:pointer}
.sclose{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(0,0,0,.45);color:#fff;font-size:18px;cursor:pointer}
.sinfo{padding:14px 16px 0}
.sinfo h2{margin:2px 0 8px;font-size:20px;line-height:1.3}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 16px;font-size:14px}
.facts dt{color:var(--sub)} .facts dd{margin:0}
.sacts{display:flex;gap:8px;padding:0 16px}
.sacts a,.sacts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:10px;
  font-size:14px;font-weight:700;text-decoration:none;cursor:pointer;border:none}
.sacts a{background:var(--chip);color:var(--accent)}
.sacts button{background:var(--ink);color:var(--bg)}
.sacts svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){.sbody,.scrim{transition:none}}

table{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface);table-layout:fixed}
col.c-price{width:66px} col.c-st{width:70px} col.c-min{width:42px} col.c-act{width:78px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;font-weight:500;color:var(--sub)}
td.nm{border-left:4px solid var(--cat);padding-left:10px}
th:first-child{padding-left:14px}
.num{text-align:right}
tr.dim td{color:var(--closed)}
.cat{display:block;font-size:11px;color:var(--cat);font-weight:700;line-height:1.3}
.name{display:block;font-weight:700;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
tr.dim .name{color:var(--sub)}
.st{font-size:12px;line-height:1.3}
.st small{display:block;font-size:11px;color:var(--sub)}
.dotted::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:4px;vertical-align:1px}
.s-open{color:var(--open)} .s-soon{color:var(--soon)} .s-closed{color:var(--closed)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.ic{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:none;
  background:var(--chip);color:var(--accent);cursor:pointer;text-decoration:none}
.ic svg{width:17px;height:17px}
.ic.add[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.empty{text-align:center;color:var(--sub);padding:40px 16px}
.note{font-size:12px;color:var(--sub);text-align:center;padding:12px 16px 24px;margin:0}

/* ボード */
#panelBoard{display:flex;flex-direction:column;overflow:hidden}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;font-size:13px;color:var(--sub)}
.bhead strong{color:var(--ink);font-size:15px}
.sync{font-size:11px}
.board{flex:1;min-height:0;position:relative;overflow:hidden;background-color:var(--board);
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.bempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:var(--sub);font-size:13px;padding:24px;pointer-events:none}
.sticky{position:absolute;width:150px;background:var(--surface);border-radius:6px;padding:8px 10px 8px;
  border-top:5px solid var(--cat);box-shadow:0 1px 2px rgba(20,35,50,.18),0 6px 14px rgba(20,35,50,.10);
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.sticky.memo{background:var(--memo);color:var(--memoInk);border-top-color:transparent;transform:rotate(-1.2deg)}
.sticky.dragging{cursor:grabbing;box-shadow:0 10px 24px rgba(20,35,50,.28);z-index:10}
.s-top{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.s-top .cat{margin:0}
.del{background:none;border:none;color:var(--sub);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;margin:-2px -4px 0 auto}
.memo .del{color:inherit;opacity:.6}
.s-name{font-weight:700;font-size:14px;line-height:1.35;margin:2px 0}
.s-text{font-size:14px;line-height:1.45;margin:2px 0 4px;overflow-wrap:anywhere;white-space:pre-wrap}
.s-meta{font-size:12px;color:var(--sub);margin:0}
.s-st{font-size:11px;margin:2px 0 0}
.s-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.vote{border:1px solid var(--line);background:transparent;border-radius:999px;padding:1px 8px;font-size:12px;cursor:pointer}
.memo .vote{border-color:rgba(0,0,0,.2)}
.vote[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.s-map{font-size:12px;color:var(--accent);text-decoration:none;font-weight:700}
.memobar{display:flex;gap:8px;padding:10px 12px;background:var(--bg)}
.memobar input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.memobar button{border:none;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;padding:0 14px;cursor:pointer}
.clear{background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;text-decoration:underline}

.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);
  background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.badge.bump{animation:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>昼めし</h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab0" aria-selected="true" aria-controls="panelList">一覧</button>
      <button class="tab" role="tab" id="tab1" aria-selected="false" aria-controls="panelBoard">ボード <span class="badge" id="badge"></span></button>
    </div>
  </div>

  <div class="pager" id="pager">
    <section class="panel" id="panelList" role="tabpanel" aria-labelledby="tab0">
      <div class="controls">
        <div class="row">
          <span>いま営業中 <b id="openCount">0</b> 軒 / <span id="total">0</span></span>
          <span><input type="time" id="t" aria-label="時刻"> <button class="linkbtn" id="nowBtn" type="button">現在時刻</button></span>
        </div>
        <div class="filters">
          <label>カテゴリ<select id="catSel"></select></label>
          <label>営業状況<select id="openSel"><option value="all">すべて</option><option value="open">営業中のみ</option></select></label>
          <label>並び替え<select id="sort">
            <option value="time">近い順</option>
            <option value="price">安い順</option>
            <option value="status">営業中を上に</option>
          </select></label>
        </div>
      </div>
      <table>
        <colgroup><col><col class="c-price"><col class="c-st"><col class="c-min"><col class="c-act"></colgroup>
        <thead><tr><th>店名</th><th>料金</th><th>営業</th><th class="num">車で</th><th></th></tr></thead>
        <tbody id="list"></tbody>
      </table>
      <p class="note">ダミーデータです。店名は架空のため、地図を開いても検索結果は出ません。</p>
    </section>

    <section class="panel" id="panelBoard" role="tabpanel" aria-labelledby="tab1">
      <div class="bhead">
        <span><strong id="bcount">候補 0件</strong> <span class="sync" id="sync">接続中…</span></span>
        <button class="clear" id="clearBtn" type="button">ボードを空にする</button>
      </div>
      <div class="board" id="board"></div>
      <form class="memobar" id="memoForm">
        <input id="memoIn" maxlength="80" placeholder="「今日はカレーの気分」などをボードに貼る" aria-label="メモ">
        <button type="submit">貼る</button>
      </form>
    </section>
  </div>
</div>
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="scrim" data-close></div>
  <div class="sbody" role="dialog" aria-modal="true" aria-labelledby="sName" id="sbody"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const CATS = {
  "ラーメン":{c:"#C0392B",h:"ramen",names:["麺屋 雪灯","中華そば 信濃川","らぁめん 七曲","背脂ラーメン 大手通","麺処 こしじ","生姜醤油 たかはし","味噌ラーメン 雪国屋","つけ麺 ふじや","麺工房 朝日","煮干しそば 蔵王町","ラーメン 千秋亭","家系 宮内家"]},
  "定食":{c:"#2E7D5B",h:"teishoku",names:["定食の店 あさひ","ごはん処 まるや","食堂 栖吉","大盛り食堂 はら","めしや 川口","日替わり定食 よつば","食事処 越路","学生食堂 もりもり","定食 こまち","旬菜 ひなた"]},
  "そば・うどん":{c:"#6D5A3A",h:"noodle",names:["手打ちそば 雪見","へぎそば 小国庵","うどん 麦の家","そば処 悠久","讃岐うどん かねこ","十割そば 蓬平","立ち食いそば 駅前","うどん酒場 つるや"]},
  "カレー":{c:"#B8860B",h:"curry",names:["カレーハウス 雪の華","スパイス食堂 ルピー","欧風カレー 樹林","カレーの店 ナガオカ","インドカレー ガネーシャ","スープカレー 北国","キーマカレー 三角","カツカレー 大将"]},
  "中華":{c:"#A8324A",h:"chinese",names:["中華料理 福満","餃子の店 龍門","四川飯店 紅梅","台湾料理 好吃","中華食堂 天心","町中華 ひろ","上海亭","担々麺 辣"]},
  "丼もの":{c:"#C4622D",h:"don",names:["丼屋 どんぶり太郎","かつ丼 越後屋","海鮮丼 寺泊","天丼 ささや","親子丼 とりいち","豚丼 ぶたや","タレかつ 新町","ローストビーフ丼 肉匠"]},
  "洋食":{c:"#3E5C9A",h:"yoshoku",names:["洋食屋 キッチンもみじ","グリル 大手","ハンバーグ 石窯亭","オムライス ぽぷら","洋食 ボンジュール","ステーキハウス 雪原","キッチン 千手","とんかつ 栄"]},
  "イタリアン":{c:"#3F8A3A",h:"italian",names:["パスタ ヴェルデ","ピッツェリア ネーヴェ","トラットリア 川西","イタリア食堂 ソーレ","生パスタ ルーチェ","カフェ&パスタ ミモザ","ピザ工房 窯"]},
  "カフェ":{c:"#7A5C8E",h:"cafe",names:["喫茶 ひだまり","カフェ 雪うさぎ","珈琲 蔵","ベーカリーカフェ こむぎ","喫茶 モアイ","ブックカフェ しおり","カフェ ナチュレ","喫茶 灯台"]},
  "焼肉":{c:"#8B3A2E",h:"yakiniku",names:["焼肉 牛若","ホルモン 炎","焼肉ランチ 大翔","ジンギスカン 羊々","焼肉 けむり","韓国料理 ソウル食堂"]},
  "寿司":{c:"#2A7A8C",h:"sushi",names:["回転寿司 海鮮丸","寿司 魚心","すし処 日本海","回転すし 波","海鮮 いろは","寿司 和"]},
  "ファストフード":{c:"#D1782A",h:"fast",names:["バーガー 雪だるま","ホットドッグ ウィンター","からあげ専門 とりまる","サンドイッチ パンドラ","タコス ロコ","フライドチキン ボス"]},
  "居酒屋ランチ":{c:"#5A6B3A",h:"izakaya",names:["居酒屋 ほろ酔い","酒場 灯","炉端 越後","大衆酒場 まつ","旬の店 やまぶき"]}
};
// 営業時間パターン [開始分, 終了分]
const H = (a,b)=>[a[0]*60+a[1], b[0]*60+b[1]];
const HOURS = {
  lunchOnly:[H([11,0],[14,30])],
  twoPart:[H([11,0],[14,30]),H([17,0],[21,0])],
  allDay:[H([11,0],[21,0])],
  cafe:[H([8,0],[18,0])],
  fast:[H([10,0],[22,0])],
  izakaya:[H([11,30],[13,30]),H([17,0],[23,0])],
  late:[H([11,30],[15,0]),H([18,0],[26,0])]
};
const CAT_HOURS = {ramen:["allDay","late","twoPart"],teishoku:["lunchOnly","twoPart"],noodle:["lunchOnly","twoPart"],
  curry:["allDay","twoPart"],chinese:["twoPart","allDay"],don:["allDay","lunchOnly"],yoshoku:["twoPart"],
  italian:["twoPart","allDay"],cafe:["cafe"],yakiniku:["twoPart"],sushi:["allDay"],fast:["fast"],izakaya:["izakaya"]};
const CAT_PRICE = {ramen:[1,1,2],teishoku:[1,1,2],noodle:[1,2],curry:[1,2],chinese:[1,1,2],don:[1,2],
  yoshoku:[2,2,3],italian:[2,2,3],cafe:[1,2],yakiniku:[2,3,3],sushi:[2,3],fast:[1],izakaya:[1,2]};

// 決まった結果になる乱数
let seed = 20260920;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; };
const pick = a => a[Math.floor(rnd()*a.length)];

const STORES = [];
for (const [cat,info] of Object.entries(CATS)){
  for (const name of info.names){
    const minutes = 2 + Math.floor(rnd()*29);           // 車で2〜30分
    STORES.push({
      id:"s"+(STORES.length+1), name, cat, color:info.c,
      price: pick(CAT_PRICE[info.h]),                  // 1:〜1,000円 2:1,000〜2,000円 3:2,000〜3,000円
      minutes,
      hours: HOURS[pick(CAT_HOURS[info.h])],
      closedDay: rnd() < .75 ? Math.floor(rnd()*7) : null   // 0=日
    });
  }
}

const STORE_BY_ID = Object.fromEntries(STORES.map(s => [s.id, s]));
const priceLabel = p => p===1 ? "〜1千円" : `${p-1}〜${p}千円`;
const fmt = m => `${Math.floor(m/60)%24}:${String(m%60).padStart(2,"0")}`;
const DAYS = "日月火水木金土";
const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mapUrl = s => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name+" 長岡")}`;
const PIN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`;
const PLUS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;
const CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

function statusOf(s, day, min){
  if (s.closedDay === day) return {k:"closed", label:"定休日", sub:`${DAYS[day]}曜休み`, rank:3};
  for (const [a,b] of s.hours){
    if (min >= a && min < b)
      return b - min <= 30 ? {k:"soon", label:"まもなく閉店", sub:`〜${fmt(b)}`, rank:1}
                           : {k:"open", label:"営業中", sub:`〜${fmt(b)}`, rank:0};
  }
  const next = s.hours.find(([a]) => a > min);
  return next ? {k:"closed", label:"準備中", sub:`${fmt(next[0])}〜`, rank:2} : {k:"closed", label:"本日終了", sub:"", rank:3};
}

const $ = id => document.getElementById(id);
const state = {cat:"すべて", openOnly:false, sort:"time", time:null};
const nowMinutes = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const curMin = () => state.time ?? nowMinutes();
const setTimeInput = m => { $("t").value = `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`; };

let toastTimer;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- ボードのデータ（共有 db が使えなければこの端末だけ） ---------- */
let items = [];            // {id, kind:"store"|"memo", storeId?, text?, x, y, votes:{}}
let uid = "me-" + Math.random().toString(36).slice(2, 8);
const local = {
  add: async d => { items = [...items, {id:"l"+Date.now()+Math.random(), ...d}]; onItems(); },
  update: async (id, p) => { items = items.map(i => i.id===id ? {...i, ...p, votes:{...i.votes, ...(p.votes||{})}} : i); onItems(); },
  remove: async id => { items = items.filter(i => i.id !== id); onItems(); }
};
let store = local;

async function connectShared(){
  const c = window.claude;
  const db = c && c.use ? await c.use("db").catch(() => null) : null;
  if (!db){ $("sync").textContent = "この端末だけのボード"; return; }
  const user = await c.use("user").catch(() => null);
  const id = user ? await user.id() : null;
  if (id) uid = id;
  const col = db.collection("board");
  const fail = e => toast(e && e.code === "quota_exceeded" ? "ボードがいっぱいです。不要な候補を消してください" : "保存できませんでした。もう一度試してください");
  store = {
    add: d => col.add(d).catch(fail),
    update: (id, p) => col.doc(id).update(p).catch(fail),
    remove: id => col.doc(id).delete().catch(fail)
  };
  col.onSnapshot(snap => {
    items = snap.docs.map(d => ({id:d.id, ...d.data()}));
    onItems();
  }, () => { $("sync").textContent = "共有が切れました（再読み込みしてください）"; });
  $("sync").textContent = "みんなと共有中";
}

const onBoard = storeId => items.find(i => i.kind === "store" && i.storeId === storeId);
let lastCount = 0;
function onItems(){
  const n = items.length;
  $("badge").textContent = n || "";
  if (n > lastCount){ const b = $("badge"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
  lastCount = n;
  $("bcount").textContent = `候補 ${n}件`;
  renderList();
  renderBoard();
  renderSheet();
}

// 既存の付箋となるべく重ならない位置を探す
function randomPos(){
  const W = Math.max(1, board.clientWidth - 150), H = Math.max(1, board.clientHeight - 130);
  let best = null, bestD = -1;
  for (let k = 0; k < 40; k++){
    const x = Math.random(), y = Math.random();
    const d = items.reduce((m, i) => Math.min(m, Math.max(Math.abs((i.x??0)-x)*W/150, Math.abs((i.y??0)-y)*H/130)), Infinity);
    if (d > bestD){ bestD = d; best = {x, y}; }
    if (d >= 1.1) break;
  }
  return {x: +best.x.toFixed(3), y: +best.y.toFixed(3)};
}

async function toggleCandidate(storeId){
  const it = onBoard(storeId);
  if (it){ await store.remove(it.id); toast("ボードから外しました"); }
  else { await store.add({kind:"store", storeId, votes:{}, at:Date.now(), ...randomPos()}); toast(`「${STORE_BY_ID[storeId].name}」を候補に追加しました`); }
}

/* ---------- 一覧 ---------- */
function renderList(){
  const day = new Date().getDay(), min = curMin();
  let rows = STORES.map(s => ({...s, st:statusOf(s, day, min)}));
  $("openCount").textContent = rows.filter(r => r.st.rank <= 1).length;
  $("total").textContent = rows.length;
  if (state.cat !== "すべて") rows = rows.filter(r => r.cat === state.cat);
  if (state.openOnly) rows = rows.filter(r => r.st.rank <= 1);
  rows.sort({
    time:(a,b)=>a.minutes-b.minutes,
    price:(a,b)=>a.price-b.price || a.minutes-b.minutes,
    status:(a,b)=>a.st.rank-b.st.rank || a.minutes-b.minutes
  }[state.sort]);
  if (!rows.length){
    $("list").innerHTML = `<tr><td colspan="5" class="empty">条件に合うお店はありません。<br>「営業中のみ」を外すか、カテゴリを変えてください。</td></tr>`;
    return;
  }
  $("list").innerHTML = rows.map(r => {
    const added = !!onBoard(r.id);
    return `<tr class="${r.st.rank>=2?"dim":""}" style="--cat:${r.color}" data-row="${r.id}">
      <td class="nm"><span class="cat">${r.cat}</span><span class="name">${r.name}</span></td>
      <td style="white-space:nowrap">${priceLabel(r.price)}</td>
      <td class="st"><span class="dotted s-${r.st.k}">${r.st.label}</span><small>${r.st.sub}</small></td>
      <td class="num">${r.minutes}分</td>
      <td><div class="acts">
        <a class="ic" href="${mapUrl(r)}" target="_blank" rel="noopener" aria-label="${r.name}をGoogleマップで開く">${PIN}</a>
        <button class="ic add" type="button" data-add="${r.id}" aria-pressed="${added}" aria-label="${added?"ボードから外す":"ボードに候補として追加"}">${added?CHECK:PLUS}</button>
      </div></td>
    </tr>`;
  }).join("");
}
$("list").addEventListener("click", e => {
  const b = e.target.closest("[data-add]"); if (b){ toggleCandidate(b.dataset.add); return; }
  if (e.target.closest("a")) return;
  const tr = e.target.closest("[data-row]"); if (tr) openSheet(tr.dataset.row);
});

/* ---------- 詳細シート（写真はダミー） ---------- */
const EMOJI = {"ラーメン":"🍜","定食":"🍱","そば・うどん":"🥢","カレー":"🍛","中華":"🥟","丼もの":"🍚","洋食":"🍳",
  "イタリアン":"🍕","カフェ":"☕","焼肉":"🥩","寿司":"🍣","ファストフード":"🍔","居酒屋ランチ":"🍶"};
let sheetId = null, lastFocus = null, renderedFor = null;
const SHOTS = [{cap:"外観",e:"🏮"},{cap:"店内",e:"🪑"},{cap:"メニュー",e:"📋"}];
function photosOf(s){
  const n = 3 + (parseInt(s.id.slice(1)) % 3);                 // ダミーで3〜5枚
  const list = [{cap:"料理",e:EMOJI[s.cat]}, ...SHOTS, {cap:"料理",e:EMOJI[s.cat]}];
  return list.slice(0, n);
}
function sheetActions(s){
  const added = !!onBoard(s.id);
  return `<a href="${mapUrl(s)}" target="_blank" rel="noopener">${PIN}地図で開く</a>
    <button type="button" data-sadd="${s.id}">${added ? CHECK + "ボードから外す" : PLUS + "候補に追加"}</button>`;
}
function renderSheet(){
  if (!sheetId) return;
  const s = STORE_BY_ID[sheetId], st = statusOf(s, new Date().getDay(), curMin());
  const statusHtml = `<span class="dotted s-${st.k}">${st.label} ${st.sub}</span>`;
  if (renderedFor === sheetId){                       // 開いている間はギャラリー位置を保ったまま一部だけ更新
    $("sAct").innerHTML = sheetActions(s); $("sSt").innerHTML = statusHtml; return;
  }
  renderedFor = sheetId;
  const ph = photosOf(s);
  $("sbody").style.setProperty("--cat", s.color);
  $("sbody").innerHTML = `
    <div class="gallery" aria-roledescription="写真ギャラリー" aria-label="${s.name}の写真（ダミー）">
      <div class="gtrack" id="gtrack">${ph.map((p,i) => `<div class="photo" role="img" aria-label="${p.cap}（${i+1}/${ph.length}枚目）" style="--mix:${[22,32,16,40,26][i]}%">${p.e}<small>${p.cap}・ダミー</small></div>`).join("")}</div>
      <span class="gcount" id="gcount">1 / ${ph.length}</span>
      <button class="gnav gprev" type="button" data-g="-1" aria-label="前の写真" disabled>‹</button>
      <button class="gnav gnext" type="button" data-g="1" aria-label="次の写真">›</button>
      <div class="gdots" id="gdots">${ph.map((_,i) => `<i class="${i?"":"on"}"></i>`).join("")}</div>
    </div>
    <button class="sclose" type="button" data-close aria-label="閉じる">×</button>
    <div class="sinfo">
      <span class="cat">${s.cat}</span>
      <h2 id="sName">${s.name}</h2>
      <dl class="facts">
        <dt>営業</dt><dd id="sSt">${statusHtml}</dd>
        <dt>営業時間</dt><dd>${s.hours.map(([a,b]) => `${fmt(a)}〜${fmt(b)}`).join(" / ")}</dd>
        <dt>定休日</dt><dd>${s.closedDay === null ? "なし" : DAYS[s.closedDay] + "曜"}</dd>
        <dt>料金</dt><dd>${priceLabel(s.price)}</dd>
        <dt>大学から</dt><dd>車で${s.minutes}分</dd>
      </dl>
    </div>
    <div class="sacts" id="sAct">${sheetActions(s)}</div>`;
  const tr = $("gtrack");
  tr.addEventListener("scroll", () => {
    const i = Math.round(tr.scrollLeft / tr.clientWidth), n = ph.length;
    $("gcount").textContent = `${i+1} / ${n}`;
    [...$("gdots").children].forEach((d,j) => d.classList.toggle("on", j === i));
    $("sbody").querySelector(".gprev").disabled = i === 0;
    $("sbody").querySelector(".gnext").disabled = i === n - 1;
  }, {passive:true});
}
function openSheet(id){
  sheetId = id; lastFocus = document.activeElement; renderSheet();
  $("sheet").classList.add("open"); $("sheet").setAttribute("aria-hidden","false");
  $("sbody").querySelector(".sclose").focus({preventScroll:true});
}
function closeSheet(){
  sheetId = null; renderedFor = null; $("sheet").classList.remove("open"); $("sheet").setAttribute("aria-hidden","true");
  if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
$("sheet").addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { closeSheet(); return; }
  const g = e.target.closest("[data-g]");
  if (g){ const tr = $("gtrack"); tr.scrollBy({left: +g.dataset.g * tr.clientWidth, behavior:"smooth"}); return; }
  const b = e.target.closest("[data-sadd]"); if (b) toggleCandidate(b.dataset.sadd);
});
addEventListener("keydown", e => {
  if (!sheetId) return;
  if (e.key === "Escape") closeSheet();
  if (e.key === "ArrowRight" || e.key === "ArrowLeft"){ const tr = $("gtrack"); tr.scrollBy({left:(e.key === "ArrowRight" ? 1 : -1) * tr.clientWidth, behavior:"smooth"}); }
});


/* ---------- ボード ---------- */
const board = $("board");
let drag = null, pendingRender = false;

function renderBoard(){
  if (drag){ pendingRender = true; return; }
  const W = board.clientWidth, H = board.clientHeight, SW = 150, SH = 130;
  const day = new Date().getDay(), min = curMin();
  if (!items.length){
    board.innerHTML = `<div class="bempty"><p>まだ候補がありません。<br>一覧の ＋ で店を貼るか、下の欄にメモを書いてください。</p></div>`;
    return;
  }
  board.innerHTML = [...items].sort((a,b)=>(a.at||0)-(b.at||0)).map(it => {
    const votes = Object.values(it.votes || {}).filter(Boolean).length;
    const mine = !!(it.votes || {})[uid];
    const left = Math.round((it.x ?? .1) * Math.max(0, W - SW)), top = Math.round((it.y ?? .1) * Math.max(0, H - SH));
    const foot = (extra) => `<div class="s-foot"><button class="vote" type="button" data-vote="${it.id}" aria-pressed="${mine}" aria-label="いいね">👍 ${votes}</button>${extra}</div>`;
    if (it.kind === "memo"){
      return `<div class="sticky memo" data-id="${it.id}" style="left:${left}px;top:${top}px">
        <div class="s-top"><span></span><button class="del" type="button" data-del="${it.id}" aria-label="メモを消す">×</button></div>
        <p class="s-text">${esc(it.text)}</p>${foot("")}</div>`;
    }
    const s = STORE_BY_ID[it.storeId]; if (!s) return "";
    const st = statusOf(s, day, min);
    return `<div class="sticky" data-id="${it.id}" style="--cat:${s.color};left:${left}px;top:${top}px">
      <div class="s-top"><span class="cat">${s.cat}</span><button class="del" type="button" data-del="${it.id}" aria-label="候補から外す">×</button></div>
      <p class="s-name">${s.name}</p>
      <p class="s-meta">${priceLabel(s.price)}　車${s.minutes}分</p>
      <p class="s-st dotted s-${st.k}">${st.label} ${st.sub}</p>
      ${foot(`<a class="s-map" href="${mapUrl(s)}" target="_blank" rel="noopener">地図</a>`)}
    </div>`;
  }).join("");
}

board.addEventListener("click", e => {
  const v = e.target.closest("[data-vote]");
  if (v){ const it = items.find(i => i.id === v.dataset.vote); if (it) store.update(it.id, {votes:{[uid]: !(it.votes||{})[uid]}}); return; }
  const d = e.target.closest("[data-del]");
  if (d) store.remove(d.dataset.del);
});

board.addEventListener("pointerdown", e => {
  const el = e.target.closest(".sticky");
  if (!el || e.target.closest("button,a")) return;
  const r = el.getBoundingClientRect();
  drag = {el, id:el.dataset.id, dx:e.clientX - r.left, dy:e.clientY - r.top, sx:e.clientX, sy:e.clientY, moved:false};
  board.appendChild(el);
  el.setPointerCapture(e.pointerId);
  el.classList.add("dragging");
});
board.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;   // 小さな動きはタップ扱い
  const b = board.getBoundingClientRect(), el = drag.el;
  const x = Math.min(Math.max(0, e.clientX - b.left - drag.dx), b.width - el.offsetWidth);
  const y = Math.min(Math.max(0, e.clientY - b.top - drag.dy), b.height - el.offsetHeight);
  el.style.left = x + "px"; el.style.top = y + "px"; drag.moved = true;
});
const endDrag = () => {
  if (!drag) return;
  const {el, id, moved, cancel} = drag;
  el.classList.remove("dragging"); drag = null;
  if (moved){
    const W = board.clientWidth - 150, H = board.clientHeight - 130;
    const x = W > 0 ? +(parseFloat(el.style.left)/W).toFixed(3) : 0;
    const y = H > 0 ? +(parseFloat(el.style.top)/H).toFixed(3) : 0;
    const it = items.find(i => i.id === id); if (it){ it.x = x; it.y = y; }
    store.update(id, {x, y});
  }
  if (pendingRender){ pendingRender = false; renderBoard(); }
  if (!moved && !cancel){
    const it = items.find(i => i.id === id);
    if (it && it.kind === "store") openSheet(it.storeId);
  }
};
board.addEventListener("pointerup", endDrag);
board.addEventListener("pointercancel", () => { if (drag) drag.cancel = true; endDrag(); });

$("memoForm").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("memoIn").value.trim(); if (!text) return;
  store.add({kind:"memo", text, votes:{}, at:Date.now(), ...randomPos()});
  $("memoIn").value = "";
});
$("clearBtn").addEventListener("click", async () => {
  if (!items.length || !confirm("ボードの候補とメモをすべて消します。よろしいですか？")) return;
  for (const it of [...items]) await store.remove(it.id);
});

/* ---------- タブと横スワイプ ---------- */
const pager = $("pager"), tabs = [$("tab0"), $("tab1")];
const goTo = i => pager.scrollTo({left: i * pager.clientWidth, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
tabs.forEach((t, i) => t.addEventListener("click", () => goTo(i)));
let current = 0;
pager.addEventListener("scroll", () => {
  const i = Math.round(pager.scrollLeft / pager.clientWidth);
  if (i !== current){ current = i; tabs.forEach((t, j) => t.setAttribute("aria-selected", j === i)); }
}, {passive:true});
addEventListener("resize", () => { pager.scrollLeft = current * pager.clientWidth; renderBoard(); });

/* ---------- 一覧の操作 ---------- */
function buildFilters(){
  $("catSel").innerHTML = ["すべて", ...Object.keys(CATS)].map(c => `<option value="${c}">${c}</option>`).join("");
  $("catSel").onchange = e => { state.cat = e.target.value; renderList(); };
  $("openSel").onchange = e => { state.openOnly = e.target.value === "open"; renderList(); };
}
$("sort").onchange = e => { state.sort = e.target.value; renderList(); };
$("t").oninput = e => { const [h,m] = e.target.value.split(":").map(Number); if (!isNaN(h)){ state.time = h*60+m; renderList(); renderBoard(); } };
$("nowBtn").onclick = () => { state.time = null; setTimeInput(nowMinutes()); renderList(); renderBoard(); };

buildFilters(); setTimeInput(nowMinutes()); onItems();
setInterval(() => { if (state.time === null){ setTimeInput(nowMinutes()); renderList(); renderBoard(); } }, 60000);
connectShared();
</script>
</body>
